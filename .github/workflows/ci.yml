name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the generator must keep reproducing the published files with new R releases.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - name: Validate the dataset (checksums, reproducibility, structure)
        run: Rscript code/check.R
